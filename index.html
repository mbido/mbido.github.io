<h2>MITM Attack on HPC hardware</h2>
<p>The goal of this project was to parallelize a meet in the middle sequential attack using MPI and OpenMP ona cluster.</p>
<h3>Hardware</h3>
<p>This project has been maid specifically for the <a href="https://www.grid5000.fr/w/Grid5000:Home">Grid5000 platform</a> but it can be modified very simply to be executed on any cluster architecture compatible with MPI and OpenMP.</p>
<h3>Links</h3>
<p><strong>Github</strong> : <a href="https://github.com/mbido/MITM-Attack-on-HPC-hardware">https://github.com/mbido/MITM-Attack-on-HPC-hardware</a> <strong>My report</strong> : <a href="https://github.com/mbido/MITM-Attack-on-HPC-hardware/blob/main/report/main.pdf">https://github.com/mbido/MITM-Attack-on-HPC-hardware/blob/main/report/main.pdf</a></p>
<h2>Perturbed Oil and Vinegar Signature Schemes</h2>
<p>SageMath implementation and study of the "Oil and Vinegar" (OV) and perturbed "OV^+" post-quantum signature schemes.</p>
<p>This project was created for a Master's research course.</p>
<h3>What's Inside</h3>
<ul>
<li><strong><code>src/</code></strong>: SageMath implementations.
<ul>
<li><code>OV/</code>: The classic OV scheme, including the Kipnis-Shamir key forgery attack.
</li>
<li><code>OV+/</code>: The perturbed OV^+ scheme, designed to be more secure.
</li>
</ul>
</li>
<li><strong><code>report/</code></strong>: A detailed report (<code>report.typ</code>) with security analysis, complexity, and performance benchmarks.
</li>
<li><strong><code>articles/</code></strong>: The research papers this project is based on.
</li>
</ul>
<h3>GitHub Repository:</h3>
<p>You can find the source code for this project on GitHub: <a href="https://github.com/mbido/Perturbed-oil-and-vinegar-signature-scheme">https://github.com/mbido/Perturbed-oil-and-vinegar-signature-scheme</a></p>
